<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Dummy explanatory image: Medium library flow">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4565"/>
      <stop offset="1" stop-color="#3E9BA4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#F9FAFB"/>

  <!-- card frame -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="780" height="520" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  </g>

  <!-- header -->
  <rect x="92" y="96" width="716" height="56" rx="14" fill="#F3F4F6"/>
  <circle cx="124" cy="124" r="10" fill="#9CA3AF"/>
  <rect x="150" y="114" width="210" height="20" rx="10" fill="#D1D5DB"/>
  <rect x="650" y="112" width="140" height="24" rx="12" fill="url(#accent)"/>
  <text x="720" y="129" text-anchor="middle" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#FFFFFF" font-weight="700">Library</text>

  <!-- left: article list -->
  <text x="110" y="198" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#374151" font-weight="700">Articles</text>
  <g>
    <rect x="92" y="214" width="420" height="108" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="112" y="236" width="86" height="64" rx="12" fill="#E5E7EB"/>
    <rect x="214" y="236" width="270" height="16" rx="8" fill="#D1D5DB"/>
    <rect x="214" y="260" width="230" height="14" rx="7" fill="#E5E7EB"/>
    <rect x="214" y="282" width="200" height="14" rx="7" fill="#E5E7EB"/>
    <g transform="translate(470,246)">
      <circle cx="18" cy="18" r="18" fill="#ECFEFF" stroke="rgba(62,155,164,0.35)"/>
      <path d="M14 10h8a2 2 0 0 1 2 2v16l-6-4-6 4V12a2 2 0 0 1 2-2z" fill="#3E9BA4"/>
    </g>
  </g>

  <g opacity="0.9">
    <rect x="92" y="336" width="420" height="108" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="112" y="358" width="86" height="64" rx="12" fill="#E5E7EB"/>
    <rect x="214" y="358" width="270" height="16" rx="8" fill="#D1D5DB"/>
    <rect x="214" y="382" width="230" height="14" rx="7" fill="#E5E7EB"/>
    <rect x="214" y="404" width="200" height="14" rx="7" fill="#E5E7EB"/>
    <g transform="translate(470,368)">
      <circle cx="18" cy="18" r="18" fill="#F3F4F6" stroke="#E5E7EB"/>
      <path d="M14 10h8a2 2 0 0 1 2 2v16l-6-4-6 4V12a2 2 0 0 1 2-2z" fill="#9CA3AF"/>
    </g>
  </g>

  <!-- right: library panel -->
  <text x="560" y="198" font-size="18" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#374151" font-weight="700">Library (Saved)</text>
  <rect x="540" y="214" width="268" height="230" rx="18" fill="#F9FAFB" stroke="#E5E7EB"/>
  <g>
    <rect x="560" y="240" width="228" height="44" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="574" y="255" width="150" height="14" rx="7" fill="#D1D5DB"/>
    <circle cx="770" cy="262" r="10" fill="url(#accent)"/>
    <rect x="560" y="294" width="228" height="44" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="574" y="309" width="170" height="14" rx="7" fill="#D1D5DB"/>
    <circle cx="770" cy="316" r="10" fill="url(#accent)"/>
    <rect x="560" y="348" width="228" height="44" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="574" y="363" width="140" height="14" rx="7" fill="#D1D5DB"/>
    <circle cx="770" cy="370" r="10" fill="url(#accent)"/>
  </g>

  <!-- caption -->
  <text x="450" y="528" text-anchor="middle" font-size="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#4B5563">
    Dummy image: Read -> Save -> Added to library
