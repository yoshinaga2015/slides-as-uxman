<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Dummy explanatory image: repository overview">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4565"/>
      <stop offset="1" stop-color="#3E9BA4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#F9FAFB"/>

  <g filter="url(#shadow)">
    <rect x="60" y="60" width="780" height="520" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  </g>

  <!-- top bar -->
  <rect x="92" y="96" width="716" height="56" rx="14" fill="#F3F4F6"/>
  <circle cx="124" cy="124" r="10" fill="#9CA3AF"/>
  <rect x="150" y="114" width="250" height="20" rx="10" fill="#D1D5DB"/>
  <rect x="662" y="112" width="128" height="24" rx="12" fill="url(#accent)"/>
  <text x="726" y="129" text-anchor="middle" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#FFFFFF" font-weight="700">Public</text>

  <!-- repo title -->
  <text x="110" y="206" font-size="22" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#374151" font-weight="800">TODO-App-Sample</text>
  <rect x="110" y="222" width="340" height="16" rx="8" fill="#E5E7EB"/>
  <rect x="470" y="196" width="320" height="64" rx="16" fill="#ECFEFF" stroke="rgba(62,155,164,0.35)"/>
  <text x="630" y="224" text-anchor="middle" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#0F766E" font-weight="700">
    One-shot generation -> organized in repo
  </text>

  <!-- file list -->
  <rect x="92" y="270" width="716" height="196" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#374151">
    <text x="120" y="306" font-weight="700">files</text>
  </g>
  <g>
    <rect x="112" y="320" width="676" height="40" rx="12" fill="#F9FAFB"/>
    <rect x="124" y="333" width="18" height="18" rx="4" fill="url(#accent)"/>
    <rect x="152" y="336" width="220" height="12" rx="6" fill="#D1D5DB"/>

    <rect x="112" y="366" width="676" height="40" rx="12" fill="#FFFFFF"/>
    <rect x="124" y="379" width="18" height="18" rx="4" fill="#9CA3AF"/>
    <rect x="152" y="382" width="260" height="12" rx="6" fill="#E5E7EB"/>

    <rect x="112" y="412" width="676" height="40" rx="12" fill="#F9FAFB"/>
    <rect x="124" y="425" width="18" height="18" rx="4" fill="#9CA3AF"/>
    <rect x="152" y="428" width="190" height="12" rx="6" fill="#E5E7EB"/>
  </g>

  <!-- code preview -->
  <rect x="92" y="484" width="716" height="78" rx="18" fill="#111827" opacity="0.96"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#E5E7EB">
